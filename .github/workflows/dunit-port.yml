name: dunit-port

# CI for the Dunit OS musl port. The provenance/plan gate is authoritative and
# must stay green; the cross-build is a work-in-progress progress tracker that
# turns into the real gate as the syscall/crt/build layers land (see PORTING.md).

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify fork provenance and porting plan
        run: |
          set -e
          test -f UPSTREAM.md
          test -f PORTING.md
          grep -q "git.musl-libc.org" UPSTREAM.md
          grep -q "b1efda5b91735e33635376ca11c9b497a1c66e39" UPSTREAM.md
          echo "provenance + porting plan present"

  tree-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upstream tree configures (host sanity — the fork is intact)
        run: |
          set -e
          ./configure --disable-shared >/tmp/configure.log 2>&1 || (tail -40 /tmp/configure.log; exit 1)
          echo "musl tree configures for the host; fork is unmodified where it must be"

  dunit-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the x86_64-dunit static libc and smoke-test dunit-cc
        run: |
          set -e
          ./tools/dunit/build-libc.sh "$PWD/_sysroot"
          test -f _sysroot/lib/libc.a
          test -f _sysroot/lib/crt1.o
          test -x _sysroot/bin/dunit-cc
          # The thread pointer must install via the native Dunit SetThreadPointer
          # (39 = 0x27), not Linux arch_prctl.
          objdump -d _sysroot/lib/libc.a | grep -A3 '<__set_thread_area>:' | grep -q 'mov .*0x27,%eax'
          # dunit-cc links a static ET_EXEC against the sysroot.
          printf 'int main(void){return 0;}\n' > /tmp/t.c
          _sysroot/bin/dunit-cc -O2 -o /tmp/t /tmp/t.c
          readelf -h /tmp/t | grep -q 'EXEC'
          echo "x86_64-dunit libc.a builds; SetThreadPointer native; dunit-cc links ET_EXEC"

  delta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need the pinned upstream base in history
      - name: Regenerate and show the Dunit delta vs upstream
        run: |
          set -e
          ./tools/dunit/gen-delta.sh
          cat DELTA.md
          # M6.1: never delete upstream files — exclude them from the build instead.
          if grep -q "Deleted upstream files" DELTA.md; then
            echo "ERROR: the Dunit delta deletes upstream files"; exit 1
          fi
          echo "delta is confined to the Dunit adaptation layer"
